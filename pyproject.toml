[project]
name = "doc-categoriser"
version = "0.1.0"
description = "Extract the text content of documents (PDFs and images) and suggest a file name for each from its content with a local LLM."
readme = "README.md"
authors = [
    { name = "YeoBenShin", email = "orang3cats@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "llama-cpp-python>=0.3.36",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
    "pdfplumber>=0.11.10",
    "pillow-heif>=1.8.1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
llama-cpp-python = [{ index = "llama-cpp-python-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "llama-cpp-python-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.extra-build-variables]
llama-cpp-python = { CC = "/usr/bin/clang", CXX = "/usr/bin/clang++" }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]

[project.scripts]
doc-categoriser = "doc_categoriser.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
