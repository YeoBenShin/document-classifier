name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pyright
      - if: runner.os == 'Windows'
        run: uv run python -c "from winrt.windows.media.ocr import OcrEngine; print('MAXDIM', OcrEngine.max_image_dimension)"
      - run: uv run pytest -v
